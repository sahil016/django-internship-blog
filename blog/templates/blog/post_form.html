{% extends 'blog/base.html' %}
{% block title %}Write - DevBlog{% endblock %}

{% block content %}
<style>
    /* Clean, structured card layout */
    .editor-container {
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        border: 1px solid #f1f5f9;
        padding: 40px;
    }

    /* Force Django's default inputs to look premium */
    input[type="text"], 
    textarea {
        display: block !important;
        width: 100% !important;
        background-color: #f8fafc !important; 
        border: 2px solid #e2e8f0 !important; 
        border-radius: 12px !important;
        padding: 14px 18px !important;
        font-size: 1.05rem !important;
        color: #1e293b !important;
        transition: all 0.3s ease-in-out !important;
        font-family: inherit !important;
        margin-top: 8px !important; 
        margin-bottom: 20px !important;
    }

    textarea {
        min-height: 250px;
        resize: vertical;
    }

    input[type="text"]:focus, 
    textarea:focus {
        outline: none !important;
        background-color: #ffffff !important;
        border-color: #6366f1 !important; 
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15) !important;
    }

    .custom-label {
        font-weight: 700;
        color: #475569;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        display: block;
    }

    /* --- DARK MODE FIXES --- */
    [data-bs-theme="dark"] .editor-container {
        background: #1e293b !important; /* Solid dark slate instead of transparent */
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
    }
    
    [data-bs-theme="dark"] .editor-container h2,
    [data-bs-theme="dark"] .editor-container p {
        color: #f8fafc !important;
    }

    [data-bs-theme="dark"] input[type="text"], 
    [data-bs-theme="dark"] textarea {
        background-color: #0f172a !important;
        border-color: #334155 !important;
        color: #f8fafc !important;
    }
    
    [data-bs-theme="dark"] input[type="text"]:focus, 
    [data-bs-theme="dark"] textarea:focus {
        background-color: #0f172a !important;
        border-color: #a855f7 !important;
    }

    [data-bs-theme="dark"] .custom-label {
        color: #cbd5e1 !important; /* Bright, readable label text in dark mode */
    }
</style>

<div class="mb-4">
    <a href="{% url 'post_list' %}" class="btn btn-outline-secondary btn-sm fw-bold rounded-pill px-3 py-2">
        <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
    </a>
</div>

<div class="editor-container mb-5">
    <div class="mb-4 border-bottom pb-3">
        <h2 class="fw-bold mb-1">Create Article</h2>
        <p class="small mb-0 opacity-75">Fill out the form below to publish a new post.</p>
    </div>

    <form method="POST">
        {% csrf_token %}
        
        <div>
            <label class="custom-label"><i class="bi bi-type me-1"></i> Title</label>
            {{ form.title }}
        </div>
        
        <div>
            <label class="custom-label"><i class="bi bi-justify-left me-1"></i> Content</label>
            {{ form.content }}
        </div>
        
        <div class="d-flex justify-content-end pt-3">
            <button type="submit" class="btn btn-gradient px-4 py-2 fs-6 rounded-3 shadow-sm">
                Publish <i class="bi bi-check2-circle ms-1"></i>
            </button>
        </div>
    </form>
</div>
{% endblock %}
