<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DevBlog{% endblock %}</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        }
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f4f5f9;
            background-image: radial-gradient(at 80% 0%, hsla(252,100%,93%,1) 0px, transparent 50%),
                              radial-gradient(at 0% 50%, hsla(280,100%,96%,1) 0px, transparent 50%);
            background-attachment: fixed;
            transition: background-color 0.4s ease, color 0.4s ease;
        }
        
        /* Dark Mode Overrides */
        [data-bs-theme="dark"] body {
            background-color: #0f172a;
            background-image: radial-gradient(at 80% 0%, hsla(252,100%,15%,1) 0px, transparent 50%),
                              radial-gradient(at 0% 50%, hsla(280,100%,10%,1) 0px, transparent 50%);
            color: #f8fafc;
        }

        [data-bs-theme="dark"] .glass-card, 
        [data-bs-theme="dark"] .bg-white {
            background: rgba(30, 41, 59, 0.7) !important;
            border: 1px solid rgba(255, 255, 255, 0.05) !important;
            color: #f8fafc !important;
        }

        [data-bs-theme="dark"] .text-dark { color: #f8fafc !important; }
        [data-bs-theme="dark"] .text-muted { color: #94a3b8 !important; }
        
        /* Glassmorphism Navbar */
        .navbar {
            background: rgba(255, 255, 255, 0.7) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            transition: background-color 0.4s ease;
        }
        [data-bs-theme="dark"] .navbar {
            background: rgba(15, 23, 42, 0.8) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .navbar-brand { font-weight: 800; letter-spacing: -0.5px; }
        .text-gradient {
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Modern Cards */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 1);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        }

        .btn-gradient {
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .btn-gradient:hover {
            opacity: 0.9;
            color: white;
            transform: translateY(-1px);
        }

        .fade-in-up { animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Hardware-accelerated buttery smooth transitions */
        .glass-card, .btn, .form-control {
            transform: translateZ(0);
            backface-visibility: hidden;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
        }

        /* Global clean input styles for the entire app */
    input[type="text"], 
    input[type="email"],
    input[type="password"],
    input[type="username"],
    textarea {
        display: block !important;
        width: 100% !important;
        background-color: #f8fafc !important; 
        border: 2px solid #e2e8f0 !important; 
        border-radius: 12px !important;
        padding: 12px 16px !important;
        font-size: 1rem !important;
        color: #1e293b !important;
        transition: all 0.3s ease-in-out !important;
        font-family: inherit !important;
        margin-top: 6px !important; 
        margin-bottom: 15px !important;
    }

    textarea {
        min-height: 120px;
        resize: vertical;
    }

    input[type="text"]:focus, 
    input[type="email"]:focus,
    input[type="password"]:focus,
    input[type="username"]:focus,
    textarea:focus {
        outline: none !important;
        background-color: #ffffff !important;
        border-color: #6366f1 !important; 
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15) !important;
    }

    /* --- GLOBAL DARK MODE INPUT STYLES --- */
    [data-bs-theme="dark"] input[type="text"], 
    [data-bs-theme="dark"] input[type="email"],
    [data-bs-theme="dark"] input[type="password"],
    [data-bs-theme="dark"] input[type="username"],
    [data-bs-theme="dark"] textarea {
        background-color: #0f172a !important;
        border-color: #334155 !important;
        color: #f8fafc !important;
    }

    [data-bs-theme="dark"] input[type="text"]:focus, 
    [data-bs-theme="dark"] input[type="email"]:focus,
    [data-bs-theme="dark"] input[type="password"]:focus,
    [data-bs-theme="dark"] input[type="username"]:focus,
    [data-bs-theme="dark"] textarea:focus {
        background-color: #0f172a !important;
        border-color: #a855f7 !important;
    }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg sticky-top py-3">
        <div class="container" style="max-width: 900px;">
            <a class="navbar-brand fs-4" href="{% url 'post_list' %}">
                <i class="bi bi-hexagon-fill text-primary me-2"></i><span class="text-gradient">DevBlog.</span>
            </a>
            <div class="ms-auto d-flex align-items-center">
                <!-- Dark Mode Toggle Button -->
                <button id="theme-toggle" class="btn btn-light rounded-circle shadow-sm me-3" style="width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;">
                    <i class="bi bi-moon-stars-fill text-dark fs-5"></i>
                </button>
                
                {% if user.is_authenticated %}
                    <a href="{% url 'post_create' %}" class="btn btn-gradient px-3 py-2 shadow-sm me-2">
                        <i class="bi bi-pen-fill me-1"></i>Write
                    </a>
                    <a href="{% url 'profile' %}" class="btn btn-outline-primary px-3 py-2 shadow-sm me-2">
                        <i class="bi bi-person-fill me-1"></i>Profile
                    </a>
                    <form action="{% url 'logout' %}" method="post" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-danger px-3 py-2 shadow-sm">Logout</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-outline-primary px-3 py-2 shadow-sm me-2">Login</a>
                    <a href="{% url 'register' %}" class="btn btn-gradient px-3 py-2 shadow-sm">Register</a>
                {% endif %}
            </div>
        </div>
        


    </nav>

<!-- Toast / Message Notifications -->
<div class="container mt-3" style="max-width: 850px;">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show glass-card border-0 shadow-sm py-3" role="alert">
                <i class="bi bi-info-circle-fill me-2"></i>{{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    {% endif %}
</div>



    <main class="container my-5 flex-grow-1 fade-in-up" style="max-width: 850px;">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center py-4 mt-auto">
        <p class="text-muted small fw-semibold mb-0">&copy; 2026 Developed with <i class="bi bi-heart-fill text-danger mx-1"></i> using Django</p>
    </footer>

    <!-- Dark Mode JavaScript -->
    <script>
        const toggleBtn = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;

        // Load saved theme from LocalStorage
        const savedTheme = localStorage.getItem('devblog-theme') || 'light';
        htmlElement.setAttribute('data-bs-theme', savedTheme);
        updateToggleButton(savedTheme);

        toggleBtn.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-bs-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            // Switch theme
            htmlElement.setAttribute('data-bs-theme', newTheme);
            localStorage.setItem('devblog-theme', newTheme);
            updateToggleButton(newTheme);
        });

        function updateToggleButton(theme) {
            if (theme === 'dark') {
                toggleBtn.innerHTML = '<i class="bi bi-sun-fill text-warning fs-5"></i>';
                toggleBtn.classList.replace('btn-light', 'btn-dark');
            } else {
                toggleBtn.innerHTML = '<i class="bi bi-moon-stars-fill text-dark fs-5"></i>';
                toggleBtn.classList.replace('btn-dark', 'btn-light');
            }
        }
    </script>
</body>
</html>
