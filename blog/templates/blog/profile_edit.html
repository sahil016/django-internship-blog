{% extends 'blog/base.html' %}
{% block title %}Edit Profile - DevBlog{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="glass-card p-4 p-md-5 mb-5">
            <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                <h2 class="fw-bold mb-0">Edit Profile</h2>
                <a href="{% url 'profile' %}" class="btn btn-outline-secondary btn-sm rounded-pill px-3 py-2">Cancel</a>
            </div>
            
            <form method="POST">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label fw-bold text-muted small text-uppercase">First Name</label>
                    {{ form.first_name }}
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold text-muted small text-uppercase">Last Name</label>
                    {{ form.last_name }}
                </div>
                
                <div class="mb-4">
                    <label class="form-label fw-bold text-muted small text-uppercase">Email Address</label>
                    {{ form.email }}
                </div>
                
                <button type="submit" class="btn btn-gradient w-100 py-2 shadow-sm">Save Changes</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
